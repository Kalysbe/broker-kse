services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sbis
      POSTGRES_PASSWORD: sbis
      POSTGRES_DB: sbis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbis -d sbis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://sbis:sbis@postgres:5432/sbis?sslmode=disable",
        "up",
      ]

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://sbis:sbis@postgres:5432/sbis?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "18080:8080"
    volumes:
      - objects:/data/objects
    command: ["/app/api"]

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://sbis:sbis@postgres:5432/sbis?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/app/worker"]

  seed:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://sbis:sbis@postgres:5432/sbis?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["/app/seed"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:18080
    depends_on:
      - api
    ports:
      - "15173:80"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18000:80"
    depends_on:
      - api
      - frontend
    profiles: ["prod"]

volumes:
  pgdata:
  objects:
