services:
  api:
    environment:
      # Local test KFB on localhost:8080 supports order entry during development.
      EXCHANGE_READ_ONLY: "false"
      KFB_GATEWAY_URL: http://host.docker.internal:8080
      KFB_GATEWAY_TOKEN: ""
      KFB_GRPC_TARGET: host.docker.internal:8443
      KFB_GRPC_SERVER_NAME: localhost
      CORS_ORIGINS: http://127.0.0.1:8082,http://localhost:8082,http://127.0.0.1:8083,http://localhost:8083,http://localhost:15173,http://localhost:18000,http://localhost
    ports: !override
      - "127.0.0.1:18080:8080"
      - "192.168.20.96:18080:8080"
      - "127.0.0.1:19090:9090"
