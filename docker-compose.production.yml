name: broker-kse

x-backend: &backend
  image: broker-kse-backend:${APP_VERSION:-latest}
  pull_policy: never
  env_file: .env
  environment: &runtime
    APP_ENV: production
    HTTP_ADDR: :8080
    GRPC_ADDR: :9090
    DATABASE_URL: postgres://sbis:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/sbis?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    OBJECT_STORE_DIR: /data/objects
    MOBILE_UPDATES_DIR: /data/mobile-updates
  extra_hosts:
    - host.docker.internal:host-gateway
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sbis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: sbis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sbis -d sbis]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - postgres://sbis:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/sbis?sslmode=disable
      - up

  seed:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [/app/seed]
    restart: "no"

  api:
    <<: *backend
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:18080:8080
      - 127.0.0.1:19090:9090
    volumes:
      - objects:/data/objects
      - ./loadtest/reports:/reports
      - ./mobile-updates:/data/mobile-updates:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: [/app/api]

  worker:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: [/app/worker]

  frontend:
    image: broker-kse-frontend:${APP_VERSION:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-80}:80
      - "5173:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  objects:
