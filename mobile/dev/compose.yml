name: sbis-mobile-dev
x-runtime: &runtime
  APP_ENV: test
  DATABASE_URL: postgres://sbis_mobile:local_mobile_only@postgres:5432/sbis_mobile?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: mobile-local-development-secret-32-only
  HMAC_PEPPER: mobile-local-development-pepper
  HTTP_ADDR: :8080
  GRPC_ADDR: :9091
  KFB_GATEWAY_URL: http://127.0.0.1:1
  KFB_GATEWAY_TOKEN: ''
  CORS_ORIGINS: http://127.0.0.1:8082,http://localhost:8082,http://localhost:8083,http://127.0.0.1:8083
  SEED_ADMIN_LOGIN: mobile-admin
  SEED_ADMIN_PASSWORD: Mobile_Dev123
  SEED_ADMIN_EMAIL: mobile-admin@example.invalid
  OBJECT_STORE_DIR: /tmp/sbis-mobile-objects
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sbis_mobile
      POSTGRES_PASSWORD: local_mobile_only
      POSTGRES_DB: sbis_mobile
    volumes: [mobile-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sbis_mobile -d sbis_mobile]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres: { condition: service_healthy }
    volumes: [../../backend/migrations:/migrations:ro]
    command: [-path, /migrations, -database, 'postgres://sbis_mobile:local_mobile_only@postgres:5432/sbis_mobile?sslmode=disable', up]
  seed:
    image: sbis-mobile-local-api
    build: { context: ../../backend }
    environment: *runtime
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: [/app/seed]
  seed-market:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: local_mobile_only
    depends_on:
      seed: { condition: service_completed_successfully }
    volumes: [./market.sql:/market.sql:ro]
    command: [psql, -h, postgres, -U, sbis_mobile, -d, sbis_mobile, -v, ON_ERROR_STOP=1, -f, /market.sql]
  api:
    image: sbis-mobile-local-api
    build: { context: ../../backend }
    environment: *runtime
    depends_on:
      seed-market: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ['127.0.0.1:18080:8080']
    command: [/app/api]
  worker:
    image: sbis-mobile-local-api
    environment: *runtime
    depends_on:
      api: { condition: service_started }
    command: [/app/worker]
volumes:
  mobile-db:
