services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sbis
      POSTGRES_PASSWORD: sbis
      POSTGRES_DB: sbis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbis -d sbis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://sbis:sbis@postgres:5432/sbis?sslmode=disable",
        "up",
      ]

  api:
    build:
      context: ./backend
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      DATABASE_URL: postgres://sbis:sbis@postgres:5432/sbis?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KFB_GATEWAY_URL: ${KFB_GATEWAY_URL:-http://host.docker.internal:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "18080:8080"
      - "19090:9090"
    volumes:
      - objects:/data/objects
      - ./backend/certs:/certs:ro
      - ./loadtest/reports:/reports
      - ./mobile-updates:/data/mobile-updates:ro
    command: ["/app/api"]

  worker:
    build:
      context: ./backend
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://sbis:sbis@postgres:5432/sbis?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KFB_GATEWAY_URL: ${KFB_GATEWAY_URL:-http://host.docker.internal:8080}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/app/worker"]

  seed:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://sbis:sbis@postgres:5432/sbis?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["/app/seed"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:18080
    depends_on:
      - api
    ports:
      - "15173:80"

  order-load:
    build:
      context: ./backend
    env_file: .env
    environment:
      LOAD_BASE_URL: ${LOAD_BASE_URL:-http://api:8080}
      LOAD_TOKEN: ${LOAD_TOKEN:-}
      LOAD_RATE: ${LOAD_RATE:-100}
      LOAD_DURATION: ${LOAD_DURATION:-10s}
      LOAD_WORKERS: ${LOAD_WORKERS:-100}
      LOAD_ACCOUNT: ${LOAD_ACCOUNT:-1-3101-006}
      LOAD_CLIENT: ${LOAD_CLIENT:-006}
      LOAD_SYMBOL: ${LOAD_SYMBOL:-KG0105166315}
      LOAD_BOARD: ${LOAD_BOARD:-LISTEDSTOCKK}
      LOAD_PRICE: ${LOAD_PRICE:-400}
      LOAD_EXECUTE: ${LOAD_EXECUTE:-false}
      LOAD_OUT: /reports
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./loadtest/reports:/reports
    command: ["/app/orderload"]
    profiles: ["loadtest"]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18000:80"
    depends_on:
      - api
      - frontend
    profiles: ["prod"]

volumes:
  pgdata:
  objects:
